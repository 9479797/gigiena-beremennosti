name: Repository hygiene pass

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hygiene:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DOCX dependency
        run: python -m pip install --quiet python-docx

      - name: Apply approved hygiene corrections
        run: python .github/repo_hygiene.py

      - name: Commit approved corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md editorial themes plugins
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Align project control files and canonical hygiene [skip ci]"
          git push
