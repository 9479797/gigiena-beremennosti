name: Repository hygiene pass

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hygiene:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DOCX dependency
        run: python -m pip install --quiet python-docx

      - name: Apply approved hygiene corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from docx import Document

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise RuntimeError(f'Expected text not found in {path}: {old[:100]!r}')
              if s.count(old) != 1:
                  raise RuntimeError(f'Expected one occurrence in {path}, got {s.count(old)}: {old[:100]!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          def replace_all(path, old, new, min_count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n < min_count:
                  raise RuntimeError(f'Expected at least {min_count} occurrences in {path}, got {n}: {old!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          def replace_in_runs(paragraph, old, new):
              runs = paragraph.runs
              full = ''.join(r.text for r in runs)
              pos = full.find(old)
              if pos < 0:
                  return False
              end = pos + len(old)
              spans = []
              cur = 0
              for i, r in enumerate(runs):
                  nxt = cur + len(r.text)
                  spans.append((i, cur, nxt))
                  cur = nxt
              si = ei = None
              so = eo = None
              for i, a, b in spans:
                  if si is None and a <= pos < b:
                      si, so = i, pos-a
                  if a < end <= b:
                      ei, eo = i, end-a
                      break
              if si is None or ei is None:
                  return False
              if si == ei:
                  t = runs[si].text
                  runs[si].text = t[:so] + new + t[eo:]
              else:
                  first = runs[si].text[:so]
                  last = runs[ei].text[eo:]
                  runs[si].text = first + new
                  for j in range(si+1, ei):
                      runs[j].text = ''
                  runs[ei].text = last
              return True

          # 1. Technical canonical hygiene pass. No medical redevelopment.
          docx_path = Path('themes/theme-1/tema_1_final_canonical.docx')
          doc = Document(docx_path)

          found = 0
          for p in doc.paragraphs:
              t = p.text
              if t.startswith('По этой причине изолированная цифра на весах не информативна сама по себе.') and 'Именно поэтому одна цифра на весах мало о чём говорит сама по себе.' in t:
                  p.text = ('По этой причине изолированная цифра на весах не информативна сама по себе. '
                            'Для оценки прибавки имеют значение исходные масса тела и индекс массы тела (ИМТ) до зачатия, '
                            'текущий гестационный срок и общая динамика набора веса.')
                  found += 1
              if '(перефразировать?)' in t:
                  p.text = ('При выраженном токсикозе, если рвотные позывы мешают удерживать таблетку, этот вопрос '
                            'обязательно обсуждают с врачом для подбора времени приёма или лекарственной формы.')
                  found += 1
              if 'Самое просто решение для получения йода из пищи - заменить обычную соль на йодированную' in t:
                  ok1 = replace_in_runs(p, 'Самое просто решение', 'Самое простое решение')
                  ok2 = replace_in_runs(p, 'пищи - заменить', 'пищи — заменить')
                  if not p.text.rstrip().endswith('.'):
                      if p.runs:
                          p.runs[-1].text = p.runs[-1].text.rstrip() + '.'
                  if not (ok1 and ok2):
                      raise RuntimeError('Could not preserve runs while fixing iodine sentence')
                  found += 1
              if 'Лабораторные анализиы:' in t:
                  if not replace_in_runs(p, 'Лабораторные анализиы: Для оценки резервов витамина D в организме, сдается',
                                         'Лабораторные анализы: для оценки резервов витамина D в организме сдаётся'):
                      raise RuntimeError('Could not fix vitamin D laboratory sentence')
                  found += 1
              if 'Обратите внимание:стандартный' in t:
                  if not replace_in_runs(p, 'Обратите внимание:стандартный', 'Обратите внимание: стандартный'):
                      raise RuntimeError('Could not fix missing space in editorial note')
                  found += 1

          if found != 5:
              raise RuntimeError(f'Expected 5 canonical technical corrections, applied {found}')

          doc.save(docx_path)
          with docx_path.open('rb') as f:
              canonical_sha = sha256(f.read()).hexdigest()

          # 2. Theme 1 README and canonical fingerprint.
          Path('themes/theme-1/README.md').write_text(f'''# Theme 1 — CANONICAL

Эта папка содержит утверждённую каноническую Тему 1 книги «Гигиена беременности».

Основной файл:

`tema_1_final_canonical.docx`

Статус: **CANONICAL**.

Использовать как ориентир по глубине, объяснительной насыщенности, практической полезности, читательской ориентации и качеству результата. Не использовать как жёсткий шаблон структуры, ритма или длины для других тем.

Канонический файл не переписывать, не сокращать и не улучшать без явного решения пользователя.

30 августа 2026 года выполнен согласованный **technical canonical hygiene pass**: удалены служебная редакторская пометка, явные технические ошибки и случайный семантически тождественный дубль. Медицинское содержание, доказательная модальность, практические действия и роль Theme 1 как STYLE/QUALITY CANON не пересматривались.

SHA-256 актуального утверждённого файла:

`{canonical_sha}`
''', encoding='utf-8')

          # 3. Process authority becomes a process spec, not a second executable skill.
          master = 'editorial/pregnancy-book-editorial-v1.6.md'
          replace_once(master,
          '''---
          name: pregnancy-book-editorial
          version: 1.6.0
          description: Master editorial skill for transforming medical and educational pregnancy materials into engaging, intelligent, book-like narrative nonfiction for pregnant readers while preserving source fidelity, medical safety, evidence boundaries, natural human voice, and editorial restraint.
          ---'''.replace('          ', ''),
          '''---
          document_id: pregnancy-book-editorial
          document_type: process-spec
          version: 1.6.0
          status: active
          description: Master editorial process specification for developing medical and educational pregnancy materials into engaging, intelligent, book-like narrative nonfiction while preserving source fidelity, medical safety, evidence boundaries, natural human voice, and editorial restraint.
          ---'''.replace('          ', ''))
          replace_once(master, 'When this skill is used inside the Pregnancy Book project:', 'When this process specification governs the Pregnancy Book project:')
          replace_once(master, '- `pregnancy-book-evidence-content-map-v3.0.md` controls', '- `editorial/pregnancy-book-evidence-content-map-v3.0.md` controls')
          replace_once(master, '- `tema_1_final_canonical.docx` is the CANONICAL QUALITY BENCHMARK:', '- `themes/theme-1/tema_1_final_canonical.docx` is the CANONICAL QUALITY BENCHMARK:')
          replace_once(master, '- `methodical-review.md` governs independent methodological review.', '- `skills/methodical-review.md` governs independent methodological review.')
          replace_once(master,
              '- This file governs the order of all stages, transition policy, handoffs, returns, state management, final acceptance, and regression/canon control.',
              '- This file is the **PROCESS AUTHORITY / SOURCE OF TRUTH** for the order of all stages, transition policy, handoffs, returns, state management, final acceptance, and regression/canon control. It is a process specification, not an executable plugin. The only executable `$pregnancy-book-editorial` is `plugins/pregnancy-book-editorial/SKILL.md`.')
          replace_once(master,
              "- If architecture/content-map decisions conflict with this skill's generic structural suggestions, the active project map controls architecture while this skill controls editorial method.",
              "- If architecture/content-map decisions conflict with this process specification's generic structural suggestions, the active project map controls architecture while this process specification controls editorial method.")
          replace_once(master, 'This skill has two explicit modes.', 'This process specification supports two explicit operating modes.')
          replace_once(master, 'The skill normally stops at a checkpoint unless an automatic transition is explicitly defined below.', 'The process normally stops at a checkpoint unless an automatic transition is explicitly defined below.')
          replace_once(master,
              '''Run:
          > Reader-JTBD → Architecture → Book Draft → Medical Evidence & Expansion → Medical Depth → Literary Refinement → Anti-Neurophrase → Lists/Rhythm → Methodical Review → Final Content Acceptance → USER STOP → Final Russian Book Edit → Depth Regression → Regression / Canon Check → Prepress Audit'''.replace('          ', ''),
              '''`FULL_REWRITE` changes the interaction cadence, not the authoritative stage order or safety gates. Run the same route used by the project:

          > SOURCE AUDIT / RESEARCH-BRIEF AUDIT → CONTENT COVERAGE → preliminary EVIDENCE & GAP ANALYSIS → Checkpoint 0 — Reader Job + Architecture → Checkpoint 1 — Book Draft → Checkpoint 2 — Medical Evidence, Integrity & Expansion → Checkpoint 2A — Medical Depth & Completeness → Depth review №1 → Checkpoint 3 — Anti-Neurophrase + Humanize → Checkpoint 4 — Lists, Rhythm & Presentation → Methodical review → Checkpoint 5 — Final Content Acceptance → MANDATORY USER STOP → Final Russian Book Edit → Depth review №2 / COMPRESSION REGRESSION → Regression / Canon Check → Prepress Audit

          Do not use `FULL_REWRITE` to bypass user gates, the mandatory stop after Checkpoint 5, or any medical/canon/author hold.'''.replace('          ', ''))
          replace_once(master,
              '''If a later correction changes wording or information function:
          > **repeat the affected content gates, Checkpoint 5, the mandatory STOP, the final Russian Book Edit, and every affected independent gate.**'''.replace('          ', ''),
              '''If a later substantive or textual correction changes wording or information function after Final Russian Book Edit:
          > **repeat Final Russian Book Edit and every independent gate whose function is affected. Before a new prepress entry, Depth review №2 and Regression / Canon Check must be fresh for the exact text version.**

          A purely technical file/layout correction that changes no words, numbers, order, meaning, or information function may use the local technical minor-fix route defined by `$pregnancy-book-prepress-audit`.'''.replace('          ', ''))

          # 4. Project instructions: exact paths, one status vocabulary, one post-final rule.
          instr = 'editorial/project-instructions-v1.6.md'
          replace_once(instr,
              '''1. `pregnancy-book-editorial-v1.6.md` — активная процедура: маршрут текста, Checkpoint’ы, остановки, автоматические переходы, возвраты и правила приёмки.
          2. `pregnancy-book-evidence-content-map-v3.0.md` — архитектура книги, границы тем, reader job, coverage и cross-links.
          3. `tema_1_final_canonical*.docx` — CANONICAL Тема 1: ориентир по глубине, объяснению, практической полезности и качеству результата; не шаблон структуры, ритма или длины.
          4. `methodical-review*.md` — независимая методическая экспертиза.
          5. `темы гигиена беременности*.docx` — резервуар исходных текстов неканонических тем.
          6. Одобренные пользователем тексты, решения, evidence ledger и Regression Watch — действующий канон конкретной темы.'''.replace('          ', ''),
              '''1. `editorial/pregnancy-book-editorial-v1.6.md` — активная PROCESS SPEC / SOURCE OF TRUTH: маршрут текста, Checkpoint’ы, остановки, автоматические переходы, возвраты и правила приёмки. Это не executable skill.
          2. `plugins/pregnancy-book-editorial/SKILL.md` — единственный executable `$pregnancy-book-editorial`; оркестратор обязан следовать активной process spec.
          3. `editorial/pregnancy-book-evidence-content-map-v3.0.md` — архитектура книги, границы тем, reader job, coverage и cross-links.
          4. `themes/theme-1/tema_1_final_canonical.docx` — CANONICAL Тема 1: ориентир по глубине, объяснению, практической полезности и качеству результата; не шаблон структуры, ритма или длины.
          5. `skills/methodical-review.md` — независимая методическая экспертиза.
          6. `themes/темы гигиена беременности — SOURCE TEXT 2–9.docx` — резервуар исходных текстов неканонических тем. Его внутренние номера тем являются legacy labels; для маршрутизации использовать `themes/SOURCE-TEXT-MAPPING.md` и активную Content Map v3.0.
          7. Одобренные пользователем тексты, решения, evidence ledger и Regression Watch — действующий канон конкретной темы.'''.replace('          ', ''))
          replace_once(instr, '`pregnancy-book-editorial-v1.6.md` является активной процедурой;', '`editorial/pregnancy-book-editorial-v1.6.md` является активной процедурой;')
          replace_once(instr, '`CONTENT READY / CONTENT READY WITH FLAGS / REQUIRES CONTENT REVISION`', '`CONTENT READY / CONTENT READY WITH FLAGS / CONTENT REQUIRES REVISION`')
          replace_once(instr,
              '- Любое изменение текста после Final Russian Book Edit должно повторно пройти финальную русскую редактуру и только те независимые проверки, функции которых затронуты.',
              '- Любая содержательная или текстовая правка после Final Russian Book Edit должна повторно пройти Final Russian Book Edit и те независимые проверки, функции которых затронуты. Перед новым входом в prepress обязательны свежие Depth review №2 и Regression / Canon Check для точной версии текста. Чисто техническая правка файла/вёрстки, не меняющая слова, числа, порядок, смысл или функцию информации, допускает локальный technical minor-fix pass без повторного содержательного цикла.')

          # 5. Content map: process-spec terminology and exact project paths.
          cmap = 'editorial/pregnancy-book-evidence-content-map-v3.0.md'
          replace_once(cmap, '- `pregnancy-book-editorial-v1.6.md` as the master editorial skill;', '- `editorial/pregnancy-book-editorial-v1.6.md` as the master editorial PROCESS SPEC / SOURCE OF TRUTH;')
          replace_once(cmap, '- `methodical-review.md` as the methodological audit framework;', '- `skills/methodical-review.md` as the methodological audit framework;')
          replace_once(cmap, '> `pregnancy-book-editorial-v1.6.md`', '> `editorial/pregnancy-book-editorial-v1.6.md`')
          replace_once(cmap, '> `methodical-review.md`', '> `skills/methodical-review.md`')

          # 6. Executable editorial plugin: unique executable layer and routing map.
          plugin = 'plugins/pregnancy-book-editorial/SKILL.md'
          replace_once(plugin,
              '- активный `pregnancy-book-editorial-v*.md` — **PROCESS AUTHORITY / SOURCE OF TRUTH** для порядка этапов, Checkpoint’ов, пользовательских остановок, автоматических переходов, handoff’ов, возвратов и правил финального принятия;',
              '- активный `editorial/pregnancy-book-editorial-v1.6.md` — **PROCESS AUTHORITY / SOURCE OF TRUTH** и неисполняемая process spec для порядка этапов, Checkpoint’ов, пользовательских остановок, автоматических переходов, handoff’ов, возвратов и правил финального принятия;')
          replace_once(plugin,
              '- `$pregnancy-book-editorial` — **ORCHESTRATOR / EXECUTABLE WORKFLOW LAYER**, который читает активный editorial-файл и ведёт тему по установленному им маршруту.',
              '- `$pregnancy-book-editorial` — **ORCHESTRATOR / EXECUTABLE WORKFLOW LAYER**, который читает активный editorial-файл и ведёт тему по установленному им маршруту.\n\n`plugins/pregnancy-book-editorial/SKILL.md` — единственный executable skill с именем `pregnancy-book-editorial`; файл в `editorial/` не должен трактоваться как второй экземпляр навыка.')
          replace_once(plugin,
              '''1. `pregnancy-book-editorial-v*.md` — управляющий редакционный документ и точные определения Checkpoint’ов;
          2. `pregnancy-book-evidence-content-map-v*.md` — активную архитектуру, reader job, границы темы, coverage и cross-links;
          3. `tema_1_final_canonical*.docx` — CANONICAL Theme 1 как эталон результата;
          4. `methodical-review*.md` — правила независимой методической экспертизы, когда она относится к запросу;
          5. `темы гигиена беременности*.docx` — резервуар исходных текстов неканонических тем;
          6. текущий черновик, redline, чистую версию, evidence ledger и журнал решений, если они доступны.'''.replace('          ', ''),
              '''1. `editorial/pregnancy-book-editorial-v1.6.md` — управляющую process spec и точные определения Checkpoint’ов;
          2. `editorial/pregnancy-book-evidence-content-map-v3.0.md` — активную архитектуру, reader job, границы темы, coverage и cross-links;
          3. `themes/theme-1/tema_1_final_canonical.docx` — CANONICAL Theme 1 как эталон результата;
          4. `skills/methodical-review.md` — правила независимой методической экспертизы, когда она относится к запросу;
          5. `themes/темы гигиена беременности — SOURCE TEXT 2–9.docx` — резервуар исходных текстов неканонических тем; при выборе материала обязательно сверять legacy labels с `themes/SOURCE-TEXT-MAPPING.md`;
          6. текущий черновик, redline, чистую версию, evidence ledger и журнал решений, если они доступны.'''.replace('          ', ''))
          replace_once(plugin, 'Семантические версии `v1.4`, `v3.0` и подобные считать значимыми.', 'Семантические версии `v1.6`, `v3.0` и подобные считать значимыми.')

          # 7. Russian Book Editor uses the actual canonical path and fresh fingerprint.
          rbe = 'plugins/russian-book-editor/SKILL.md'
          replace_once(rbe, 'редакции «theme 1 canonical.docx» из обязательного справочника ниже.', 'редакции `themes/theme-1/tema_1_final_canonical.docx` из обязательного справочника ниже.')

          voice = 'plugins/russian-book-editor/references/pregnancy-author-voice.md'
          replace_once(voice,
              '''Основание: файл «theme 1 canonical.docx», лично отредактированный пользователем
          и выбранный им как образец 30 августа 2026 года. Контрольная сумма SHA-256:
          `de33e32c8a8bd6ffb963e33683ba641ef098fbc179dec1bb798adf76572b3052`.
          Профиль и выдержки ниже сохраняют стилевой ориентир без зависимости от
          временного пути к загруженному файлу.'''.replace('          ', ''),
              f'''Основание: файл `themes/theme-1/tema_1_final_canonical.docx`, лично отредактированный пользователем
          и выбранный им как образец 30 августа 2026 года. После согласованного technical canonical hygiene pass контрольная сумма SHA-256:
          `{canonical_sha}`.
          Technical hygiene pass удалил только служебную пометку, явные технические ошибки и случайный дубль; он не является новой автоматической авторской редакцией и не меняет статус `STYLE CANON`.
          Профиль и выдержки ниже сохраняют стилевой ориентир без зависимости от
          временного пути к загруженному файлу.'''.replace('          ', ''))

          # 8. Legacy source routing map.
          Path('themes/SOURCE-TEXT-MAPPING.md').write_text('''# Mapping исходного SOURCE TEXT на активную архитектуру v3.0

          Этот файл служит только для маршрутизации материалов из `темы гигиена беременности — SOURCE TEXT 2–9.docx` в действующую архитектуру книги.

          **SOURCE TEXT — это резервуар исходного материала, а не approved canon и не медицинское доказательство.** Номера и названия тем внутри исходного DOCX являются legacy labels. Они не определяют номер или границы темы в текущей книге.

          Архитектуру всегда определяет `editorial/pregnancy-book-evidence-content-map-v3.0.md`. При извлечении материала сначала выбрать активную тему по Content Map, затем использовать эту таблицу для поиска подходящих исходных блоков по содержанию.

          ## Соответствие блоков

          | Блок в SOURCE TEXT | Активное назначение по Content Map v3.0 | Правило использования |
          |---|---|---|
          | Тема 2 — «Режим дня и сон» | Theme 2 — «Режим дня, сон и восстановление» | Прямой основной источник для SOURCE AUDIT Theme 2; границы и недостающие блоки определяет Content Map. |
          | Тема 3 — «Физическая активность во время беременности» | Theme 3 — «Физическая активность и тело» | Прямой основной источник для SOURCE AUDIT Theme 3; не считать старую структуру исчерпывающей. |
          | Тема 4 — «Интимное здоровье во время беременности» | Theme 4 — «Интимное здоровье и сексуальная жизнь» | Прямой основной источник для SOURCE AUDIT Theme 4. |
          | Тема 5 — «Кожа и интимная гигиена…» | Theme 5 — «Кожа, уход за телом и интимная гигиена» | Прямой основной источник для SOURCE AUDIT Theme 5. |
          | Тема 6 — «Полость рта во время беременности…» | Theme 6 — «Здоровье полости рта» | Прямой основной источник для SOURCE AUDIT Theme 6. |
          | Отдельной legacy-главы нет | Theme 7 — «Лекарства, добавки и лечебные средства» | Не назначать Theme 7 по совпадению номера. Искать только релевантные фрагменты по содержанию; основную архитектуру и coverage строить по Content Map и отдельному research/evidence. |
          | Отдельной legacy-главы нет | Theme 8 — «Привычки, воздействия и повседневная безопасность» | Не назначать Theme 8 по совпадению номера. Искать релевантные фрагменты по содержанию; пробелы закрывать через research/evidence. |
